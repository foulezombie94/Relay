name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix packages/zyliad-mcp
      - run: npm run check:secrets
      - run: npm run format:check
      - run: npm run check:structure
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests and log secret scan
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/zyliad-test-output.log
          node --import tsx scripts/tests/secret-boundaries.mts /tmp/zyliad-test-output.log
      - run: npm run test:jobs
      - name: Build with an isolated local test configuration
        run: npm run build
        env:
          NEXT_PUBLIC_RELAY_ENVIRONMENT: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
          APP_URL: http://127.0.0.1:3000
      - run: npm run check:secrets:bundles
  agent-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.6.1.136@sha256:5a4314708484bec672de2c09653a5c01fb1c84a998564ac231b0325e2238ed5b
        env:
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAY_TEST_DATABASE_URL: postgres://postgres:fixture-password@127.0.0.1:5432/relay_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/tests/create-local-database.mts
      - run: node --import tsx scripts/tests/migrate-local.mts
      - run: npm run test:integrations:db
      - run: npm run test:agent:db
      - run: npm run test:mcp:db
      - run: npm run test:performance:db
      - run: npm run test:agent:concurrency
      - run: npm run test:agent:tokens
